# Render Blueprint: creates the database and the web service from this repo.
# Every push to master deploys again (auto-deploy is on by default).

databases:
  - name: plants-db
    region: frankfurt
    plan: free
    ipAllowList: [] # only the app can reach the DB, not the internet

services:
  - type: web
    name: plantsv2
    runtime: python
    region: frankfurt
    plan: free
    buildCommand: pip install -r requirements.txt
    # Migrations run on every start: the free plan has no pre-deploy command.
    startCommand: alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.10" # same as local; Render's default is 3.14
      - key: DB_URL
        fromDatabase:
          name: plants-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true # Render makes a random one
      - key: GEMINI_API_KEY
        sync: false # Render asks for it once, when the Blueprint is created
